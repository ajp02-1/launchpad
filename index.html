:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --surface-2: #E8ECEA;
  --ink: #19202C;
  --muted: #5A6575;
  --line: #D5DCD9;
  --accent: #33379E;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E5F6;
  --warn: #B4432A;
  --warn-soft: #FBE5DD;
  --amber: #8A5A0E;
  --amber-soft: #FBEFD6;
  --ok: #2B7A50;
  --ok-soft: #DDF0E5;
  --routine: #6F7D90;
  --scrim: rgba(12, 16, 26, 0.48);
  --font-ui: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131A;
    --surface: #191E28;
    --surface-2: #232A37;
    --ink: #E8ECF2;
    --muted: #9CA6B6;
    --line: #2C3443;
    --accent: #9296FF;
    --accent-ink: #0E1024;
    --accent-soft: #262A52;
    --warn: #FF8D6E;
    --warn-soft: #3A2220;
    --amber: #F0BC5E;
    --amber-soft: #3A2F18;
    --ok: #62C892;
    --ok-soft: #173326;
    --routine: #7E8BA0;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131A;
  --surface: #191E28;
  --surface-2: #232A37;
  --ink: #E8ECF2;
  --muted: #9CA6B6;
  --line: #2C3443;
  --accent: #9296FF;
  --accent-ink: #0E1024;
  --accent-soft: #262A52;
  --warn: #FF8D6E;
  --warn-soft: #3A2220;
  --amber: #F0BC5E;
  --amber-soft: #3A2F18;
  --ok: #62C892;
  --ok-soft: #173326;
  --routine: #7E8BA0;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
h1 { font-size: 28px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
@media (max-width: 420px) { h1 { font-size: 24px; } .focus h1 { font-size: 26px; } }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: auto;
}
.brand-mark {
  width: 14px;
  height: 26px;
  border-radius: 7px;
  background: linear-gradient(#F2C14E, #EE8550 45%, #9A5BC4 75%, #2E3380);
}
.iconbtn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  display: inline-grid;
  place-items: center;
  color: var(--ink);
  flex: none;
}
.iconbtn:hover { background: var(--surface-2); }
.tabs {
  display: flex;
  gap: 4px;
}
.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 15px;
}
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 18px 16px 48px;
}
@media (max-width: 759px) {
  .tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 25;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
  }
  .tab { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 14px; border-radius: 14px; min-width: 76px; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- sync status in the header (Mac app and phone app) */
.syncpill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 12px 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);

/* ---------- buttons, chips, tags */

/* ---------- playbook */

}

    if (it.type === 'custom' && itemInfo(it)) push({ key: keyOfItem(it), type: 'custom', title: it.title, classId: it.classId, min: it.min, group: 'today', taskId: it.taskId });
  }
  for (const r of [...state.routines].sort((a, b) => PHASE[a.phase] - PHASE[b.phase] || a.order - b.order)) {
    const key = itemKey('routine', r.id);
    if (!r.days.includes(wd) && !onDay.has(key)) continue;
    push({ key, type: 'routine', ref: r.id, title: r.name, emoji: r.emoji, min: r.min, group: 'routine' });

}
function suggestLaunch(cands, sel) {
  const pool = cands.filter((c) => sel[c.key] && c.type !== 'routine');
  if (!pool.length) return null;
  const flagged = pool.find((c) => c.launch);
  if (flagged) return flagged.key;
  const easy = pool.filter((c) => !c.hard).sort((a, b) => a.min - b.min);
  return (easy[0] || [...pool].sort((a, b) => a.min - b.min)[0]).key;
}

  const cap = capacityFor(date);
  const total = cap.live ? items.filter((i) => !itemInfo(i).done).reduce((s, i) => s + i.min, 0) : items.reduce((s, i) => s + i.min, 0);
  const welcome = !items.length && !!gh.ns && isEmptyState(state);
  let h = `<section aria-labelledby="day-title">

function meterHtml(total, cap, label) {
  const over = total - cap;
  const pct = cap > 0 ? Math.min(100, (total / cap) * 100) : 0;
  const status = over > 0
    ? `<span class="warn"><strong>${fmtDur(over)} over.</strong> Move something to another day.</span>`
    : `<span><strong>${fmtDur(-over)}</strong> of breathing room</span>`;
  return `<div class="meter ${over > 0 ? 'is-over' : ''}" role="group" aria-label="Capacity check">
    <div class="meter-top"><span>${label || `${fmtDur(total)} planned out of ${fmtDur(cap)}`}</span>${status}</div>
    <div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div>
  </div>`;
}
function timelineHtml(date, day, items, win, isToday) {
  const now = isToday ? nowMin() : null;
  const rows = [];
  let nowItem = null;
  if (isToday) nowItem = items.find((i) => !itemInfo(i).done && i.start <= now && now < i.start + i.min) || null;
  let nowPlaced = !isToday || !!nowItem || now < win.start - 60 || now > Math.max(win.end, items.length ? items[items.length - 1].start + items[items.length - 1].min : 0) + 60;
  const nowRow = () => `<li class="tl-nowrow"><div class="tl-time">${esc(fmtTime(now))}</div><div class="tl-rail" style="--a:${skyAt(now)};--b:${skyAt(now)}"><span class="tl-node" style="--c:var(--accent)"></span></div><div class="tl-marktext">Now</div></li>`;
  const firstStart = Math.min(win.start, items[0].start);
  if (!nowPlaced && now < firstStart) { rows.push(nowRow()); nowPlaced = true; }
  rows.push(`<li class="tl-mark"><div class="tl-time">${esc(fmtTime(win.start))}</div><div class="tl-rail" style="--a:${skyAt(win.start)};--b:${skyAt(win.start)}"><span class="tl-node" style="--c:${skyAt(win.start)}"></span></div><div class="tl-marktext">Afternoon starts</div></li>`);
  let cursor = firstStart;
  let prevEnd = -Infinity;
  items.forEach((it) => {
    const info = itemInfo(it);
    if (!nowPlaced && now < it.start && now >= cursor) {
      const g1 = now - cursor;
      if (g1 >= 5) rows.push(gapRow(cursor, g1));
      rows.push(nowRow());
      nowPlaced = true;
      cursor = Math.max(cursor, now);
    }
    const gap = it.start - cursor;
    if (gap >= 5) rows.push(gapRow(cursor, gap));
    const flags = {
      launch: it.id === day.launchItemId && !info.done,
      now: nowItem === it,
      overlap: it.start < prevEnd,
      late: it.start + it.min > win.end && !info.done,
    };
    rows.push(itemRow(it, info, flags));
    prevEnd = Math.max(prevEnd, it.start + it.min);
    cursor = Math.max(cursor, it.start + it.min);
  });
  if (!nowPlaced && now >= cursor && now <= win.end) {
    if (now - cursor >= 5) rows.push(gapRow(cursor, now - cursor));
    rows.push(nowRow());
    cursor = now;
    nowPlaced = true;
  }
  if (win.end - cursor >= 5) rows.push(gapRow(cursor, win.end - cursor));
  rows.push(`<li class="tl-mark"><div class="tl-time">${esc(fmtTime(win.end))}</div><div class="tl-rail" style="--a:${skyAt(win.end)};--b:${skyAt(win.end + 60)}"><span class="tl-node" style="--c:${skyAt(win.end)}"></span></div><div class="tl-marktext">Wind-down starts<small>Screens down, get ready for sleep.</small></div></li>`);
  if (!nowPlaced && now > win.end) rows.push(nowRow());
  return `<ol class="timeline" aria-label="Timeline for ${esc(fmtLong(date))}">${rows.join('')}</ol>`;
}
function gapRow(start, len) {
  return `<li class="tl-gap"><div class="tl-time"></div><div class="tl-rail" style="--a:${skyAt(start)};--b:${skyAt(start + len)}"></div><div class="tl-gaptext">Free, ${fmtDur(len)}</div></li>`;
}
function itemRow(it, info, flags) {
  const end = it.start + it.min;
  const hgt = Math.max(30, Math.min(110, Math.round(it.min * 0.8)));
  const node = info.emoji ? esc(info.emoji) : esc((info.label || info.title || '•').trim().charAt(0).toUpperCase());
  const tags = [];
  if (flags.now) tags.push('<span class="tag tag-accent">Now</span>');
  if (flags.launch) tags.push('<span class="tag tag-ok">Start here</span>');
  if (info.hard && !info.done) tags.push('<span class="tag tag-amber">Hard right now</span>');
  if (info.fixed != null && info.routine) tags.push('<span class="tag">Fixed time</span>');
  if (flags.overlap) tags.push('<span class="tag tag-warn">Overlaps</span>');
  if (flags.late) tags.push('<span class="tag tag-warn">Runs past wind-down</span>');
  return `<li class="tl-row ${info.done ? 'is-done' : ''} ${flags.now ? 'is-now' : ''}">
    <div class="tl-time">${esc(fmtTime(it.start))}</div>
    <div class="tl-rail" style="--a:${skyAt(it.start)};--b:${skyAt(end)}"><span class="tl-node ${info.emoji ? 'emoji' : ''}" style="--c:${info.color};height:${hgt}px">${node}</span></div>
    <div class="tl-body">
      <button class="tl-main" data-act="openItem" data-id="${esc(it.id)}">
        <span class="tl-title">${esc(info.title)}</span>
        ${info.sub ? `<span class="tl-sub">${esc(info.sub)}</span>` : (info.label && !info.routine ? `<span class="tl-sub">${esc(info.label)}</span>` : '')}
        <span class="tl-when">${esc(fmtRange(it.start, end))}<span class="dur">${fmtDur(it.min)}</span></span>
        ${tags.length ? `<span class="tags">${tags.join('')}</span>` : ''}
      </button>
      <button class="tl-check" data-act="toggleItem" data-id="${esc(it.id)}" aria-pressed="${info.done ? 'true' : 'false'}" aria-label="${info.done ? 'Mark not done' : 'Mark done'}: ${esc(info.title)}">${ICON.check}</button>
    </div>
  </li>`;
}
function reviewHtml(date, items) {
  if (!items.length) return '';
  const day = getDay(date);
  const r = day && day.review;
  if (r) {
    const startTxt = r.start != null ? fmtTime(r.start) : (day.firstStart != null ? fmtTime(day.firstStart) : 'Not recorded');
    return `<section class="review" aria-labelledby="rev-h">

    <div><button class="btn" data-act="openReview">Review this day</button></div>
  </section>`;
}

function cardHtml(t, today) {
  const tags = [];
  if (!t.done) {
    if (isProject(t)) {
      const open = t.steps.filter((s) => !s.done);
      const noDay = open.filter((s) => !s.doOn).length;
      if (noDay) tags.push(`<span class="tag tag-warn">${noDay} ${noDay === 1 ? 'step needs' : 'steps need'} a day</span>`);
      const nextDated = open.filter((s) => s.doOn).map((s) => s.doOn).sort()[0];
      if (nextDated) tags.push(`<span class="tag ${nextDated < today ? 'tag-warn' : 'tag-accent'}">Next: ${esc(dayWord(nextDated))}</span>`);
    } else if (!t.doOn) tags.push('<span class="tag tag-warn">Pick a day</span>');
    else tags.push(`<span class="tag ${t.doOn < today ? 'tag-warn' : 'tag-accent'}">${t.doOn < today ? 'Was planned ' : ''}${esc(dayWord(t.doOn))}</span>`);
    if (t.unsure) tags.push('<span class="tag tag-amber">Check if there is any</span>');
    if (t.hard) tags.push('<span class="tag tag-amber">Hard right now</span>');
    if (t.launch) tags.push('<span class="tag tag-ok">Good starter</span>');
    if (t.due) tags.push(`<span class="tag">Due ${esc(fmtShort(t.due))}</span>`);
    const qs = t.questions.filter((q) => !q.asked).length;
    if (qs) tags.push(`<span class="tag">${qs} ${qs === 1 ? 'question' : 'questions'} to ask</span>`);
  }
  let sub = '';
  let prog = '';
  if (isProject(t)) {
    const doneN = t.steps.filter((s) => s.done).length;
    sub = `${fmtDur(remainingMin(t))} left, ${doneN} of ${t.steps.length} steps done`;
    prog = `<div class="progress" style="--c:${colorOf(t.classId)}"><span style="width:${(doneN / t.steps.length * 100).toFixed(0)}%"></span></div>`;
  } else sub = fmtDur(t.min);
  return `<div class="card ${t.done ? 'is-done' : ''}">
    <button class="card-main" data-act="editTask" data-id="${esc(t.id)}">
      <span class="card-title">${esc(t.title)}</span>
      <span class="card-sub">${esc(sub)}</span>
      ${prog}
      ${tags.length ? `<span class="tags">${tags.join('')}</span>` : ''}
    </button>
    <button class="card-check" data-act="toggleTask" data-id="${esc(t.id)}" aria-pressed="${t.done ? 'true' : 'false'}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${esc(t.title)}">${ICON.check}</button>
  </div>`;
}

function startsHtml() {

    if (!day) continue;
    const st = day.review && day.review.start != null ? day.review.start : day.firstStart;
    if (st == null) continue;
    rows.push({ d, st });
  }
  const lo = 900, hi = 1260;
  const pos = (m) => Math.max(0, Math.min(100, ((m - lo) / (hi - lo)) * 100));
  let body;
  if (!rows.length) {
    body = '<p class="muted">Your start times will show up here. They’re recorded the first time you press Start in focus mode each day, or when you fill in your review.</p>';

    const avg = Math.round(rows.reduce((s, r) => s + r.st, 0) / rows.length);

      <div class="starts">${rows.map((r) => `<div class="start-row"><span>${esc(fmtShort(r.d).replace(',', ''))}</span><div class="start-track"><span class="six" style="left:${pos(1080)}%"></span><span class="dot" style="left:${pos(r.st)}%;background:${skyAt(r.st)}"></span></div><span>${esc(fmtTime(r.st))}</span></div>`).join('')}
      <div class="start-scale"><span></span><div><span>3 PM</span><span>6 PM</span><span>9 PM</span></div><span></span></div></div>`;
  }
  return `<div class="pb"><h2>When you started</h2>${body}</div>`;
}
function questionsHtml() {

    ? `<ul class="qlist">${qs.map(({ t, q }) => `<li><div><span class="tag" style="margin-bottom:4px">${esc((cls(t.classId) || {}).name || '')}</span><div>${esc(q.text)}</div><span class="small muted">${esc(t.title)}</span></div><button class="mini" data-act="askedQ" data-task="${esc(t.id)}" data-id="${esc(q.id)}">Asked</button></li>`).join('')}</ul>`

function closeSheet() { ui.sheet = null; $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; }
function renderSheet(focusFirst) {

  root.innerHTML = `<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${content}</div>`;

function buildPlan(s) {
  const date = s.date;
  const cands = planCandidates(date, s.checks);
  for (const [tid, ans] of Object.entries(s.checks)) {
    const t = task(tid); if (!t) continue;

  }
  const day = getDay(date, true);
  const keep = day.items.filter((i) => itemInfo(i) && itemInfo(i).done);
  const keepKeys = new Set(keep.map(keyOfItem));
  const items = keep.slice();
  let launchItemId = null;
  for (const c of cands) {
    if (keepKeys.has(c.key)) continue;
    if (!s.sel[c.key]) { if (c.existing) clearDoOn(c, date); continue; }
    let it = c.existing;
    if (!it) {
      it = { id: uid('i'), type: c.type, ref: c.ref || null, stepId: c.stepId || null, min: c.min, start: 0, done: false, title: null, classId: null, taskId: null };
      if (c.type === 'custom') { it.title = c.title; it.classId = c.classId || null; it.taskId = c.taskId || null; }
      // pulled in from another day: take it off that day
      if (c.type === 'task' || c.type === 'step') {
        for (const [d2, dd] of Object.entries(state.days)) if (d2 !== date) dd.items = dd.items.filter((i) => keyOfItem(i) !== c.key || (itemInfo(i) && itemInfo(i).done));
      }
    }
    items.push(it);
    setDoOn(c, date);
    if (s.launch === c.key) launchItemId = it.id;
  }
  day.items = items;
  day.launchItemId = launchItemId;
  arrange(date);
  return launchItemId ? findItem(date, launchItemId) : null;
}

// ---------- focus mode
function openFocus(date, itemId) {
  const it = findItem(date, itemId);
  if (!it) return;
  if (ui.focus && ui.focus.itemId !== itemId) endFocus(true);
  if (!ui.focus) {
    const isRoutine = !!(itemInfo(it) && itemInfo(it).routine);
    ui.focus = { date, itemId, mode: isRoutine ? 'timer' : 'focus', running: false, remaining: isRoutine ? it.min * 60000 : state.settings.focusMin * 60000, timeUp: false, endsAt: 0, lastTick: 0, rounds: 0, elapsed: 0, stuckEndsAt: null, stuckPrompt: false, overrun: false, overrunShown: false, qDraft: '', hidden: false };
  }

  closeSheet();
  renderFocus();
}
function endFocus(silent) { ui.focus = null; $('#focus-root').innerHTML = ''; document.body.style.overflow = ''; if (!silent) render(); }
function blockTotal(f) {
  if (f.mode === 'timer') { const it = findItem(f.date, f.itemId); return Math.max(60000, (it ? it.min : 1) * 60000); }

}

    return;
  }
  document.body.style.overflow = 'hidden';
  const total = blockTotal(f);
  const C = 2 * Math.PI * 88;
  const off = C * (1 - f.remaining / total);
  const modeText = f.mode === 'timer' ? (f.timeUp ? 'Time’s up' : 'Time left') : f.mode === 'focus' ? `Focus block ${f.rounds + 1}` : 'Break. Stand up, stretch, no phone.';
  const canAsk = !info.routine;

    <div class="focus-inner">
      <div class="focus-top"><span class="label">${esc(info.sub || info.label || 'Focus')}</span><button class="iconbtn" data-act="focusHide" aria-label="Minimize focus mode">${ICON.close}</button></div>
      <h1 id="f-title">${esc(info.title)}</h1>
      <div class="focus-cards">
        ${info.firstStep ? `<div class="focus-card"><b>First tiny step</b>${esc(info.firstStep)}</div>` : ''}
        ${info.doneDef ? `<div class="focus-card"><b>Done looks like</b>${esc(info.doneDef)}</div>` : ''}
      </div>
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88" fill="none" stroke-width="12"/><circle class="ring-fg" id="f-ring" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
        <div class="ring-text"><div class="clock" id="f-clock" role="timer" aria-live="off">${mmss(f.remaining)}</div><div class="mode">${esc(modeText)}</div></div>
      </div>
      <div class="focus-ctl">
        ${f.running ? '<button class="btn" data-act="focusPause">Pause</button>' : (f.timeUp ? '' : `<button class="btn primary" data-act="focusStart">${f.remaining < total ? 'Resume' : (f.mode === 'break' ? 'Start break' : 'Start')}</button>`)}

      ${f.overrun ? `<div class="callout amberbox"><b>You’ve reached your estimate of ${fmtDur(it.min)}.</b> Check your “done” line. If it’s met, it’s done. Polish only if there’s spare time later.

function elapsedText(f, it) { const m = Math.floor(f.elapsed / 60000); return `${m} of ${it.min} planned minutes focused`; }
function stuckHtml(f) {

    return `<div class="stuckbox"><b>${state.settings.stuckMin} minutes is your limit for one problem.</b><span class="small muted">Write down exactly what’s confusing you, then move on to the next one. It’s saved for your teacher.</span>

    f.lastTick = now;

    if (f.remaining <= 0 && f.mode === 'timer') {
      f.remaining = 0; f.running = false; f.timeUp = true;

    if (f.remaining <= 0) { f.remaining = 0; switchMode(); return; }
  }

    const st = fromHHMM($('#w-start').value), en = fromHHMM($('#w-end').value);
    if (st == null || en == null || en <= st) { toast('Wind-down has to come after the start time.'); return; }
    if (el.dataset.scope === 'default') { state.settings.dayStart = st; state.settings.dayEnd = en; const d = getDay(s.date); if (d) { d.start = null; d.end = null; } }
    else { const d = getDay(s.date, true); d.start = st; d.end = en; }
    closeSheet(); commit();
  },
  openReview() { openSheet({ kind: 'review', date: ui.date }); },
  reviewSave() {
    const s = ui.sheet; const day = getDay(s.date, true);
    day.review = { start: fromHHMM($('#r-start').value), helped: $('#r-helped').value.trim(), blocked: $('#r-blocked').value.trim(), kind: $('#r-kind').value.trim() };
    closeSheet(); commit(); toast('Review saved. See your start times in the Playbook.');
  },

  // board
  newClass() { openSheet({ kind: 'klass', draft: { id: null, name: '', color: PALETTE[state.classes.length % PALETTE.length] } }); },
  editClass(el) { const c = cls(el.dataset.id); if (c) openSheet({ kind: 'klass', draft: clone(c) }); },
  classColor(el) { ui.sheet.draft.name = $('#c-name').value; ui.sheet.draft.color = el.dataset.v; renderSheet(); },
  classSave() {
    const d = ui.sheet.draft; d.name = $('#c-name').value.trim();
    if (!d.name) { toast('Give the class a name.'); return; }
    if (d.id) Object.assign(cls(d.id), d); else state.classes.push({ ...d, id: uid('c') });
    closeSheet(); commit();
  },
  classDelete() {
    const d = ui.sheet.draft;
    const n = state.tasks.filter((t) => t.classId === d.id).length;
    confirmSheet(`Delete ${d.name}?`, n ? `This also deletes its ${n} ${n === 1 ? 'task' : 'tasks'}.` : 'The column will be removed.', 'Delete class', () => {
      state.tasks.filter((t) => t.classId === d.id).forEach((t) => removeTaskEverywhere(t.id));
      state.tasks = state.tasks.filter((t) => t.classId !== d.id);
      state.classes = state.classes.filter((c) => c.id !== d.id);
      commit();
    });
  },
  newTask(el) { if (!state.classes.length) { actions.newClass(); return; } openSheet({ kind: 'task', draft: newTaskDraft(el.dataset.class || state.classes[0].id) }); },
  editTask(el) { const t = task(el.dataset.id); if (t) openSheet({ kind: 'task', draft: clone(t) }); },
  toggleTask(el) {
    const t = task(el.dataset.id); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
    if (t.done && t.unsure) t.unsure = false;
    commit();
    if (t.done) toast(`Done: ${t.title}`);
  },
  taskPad() { syncTaskDraft(); const d = ui.sheet.draft; d.min = round5(d.min * 1.25); renderSheet(); toast(`Estimate is now ${fmtDur(d.min)}.`); },
  taskDoOn(el) { syncTaskDraft(); const v = el.dataset.v; ui.sheet.draft.doOn = v === 'today' ? todayYmd() : v === 'tomorrow' ? addDays(todayYmd(), 1) : null; renderSheet(); },
  stepAdd() { syncTaskDraft(); const d = ui.sheet.draft; d.steps.push({ id: uid('s'), title: '', min: 15, done: false, doOn: null }); renderSheet(); const rows = $$('.s-title'); if (rows.length) rows[rows.length - 1].focus(); },
  stepDel(el) { syncTaskDraft(); const d = ui.sheet.draft; d.steps = d.steps.filter((x) => x.id !== el.dataset.id); renderSheet(); },
  stepMove(el) { syncTaskDraft(); const d = ui.sheet.draft; const i = d.steps.findIndex((x) => x.id === el.dataset.id); const j = i + Number(el.dataset.dir); if (i < 0 || j < 0 || j >= d.steps.length) return; [d.steps[i], d.steps[j]] = [d.steps[j], d.steps[i]]; renderSheet(); },
  draftAsked(el) { syncTaskDraft(); const q = ui.sheet.draft.questions.find((x) => x.id === el.dataset.id); if (q) q.asked = true; renderSheet(); },
  taskSave() { if (saveTaskDraft()) closeSheet(); },
  taskDelete() {
    const d = ui.sheet.draft;
    confirmSheet(`Delete “${d.title}”?`, 'It will be removed from the Board and from any day it was planned on.', 'Delete task', () => {
      removeTaskEverywhere(d.id);
      state.tasks = state.tasks.filter((t) => t.id !== d.id);
      commit();
    });
  },
  askedQ(el) { const t = task(el.dataset.task); const q = t && t.questions.find((x) => x.id === el.dataset.id); if (q) { q.asked = true; commit(); } },

  // settings
  routineAdd() { syncSettingsDraft(); ui.sheet.draft.routines.push({ id: uid('r'), name: 'New routine', emoji: '⭐', min: 15, phase: 'end', order: ui.sheet.draft.routines.length, days: [1, 2, 3, 4, 5], fixed: null, doneDef: '' }); renderSheet(); },
  routineDel(el) { syncSettingsDraft(); ui.sheet.draft.routines = ui.sheet.draft.routines.filter((r) => r.id !== el.dataset.id); renderSheet(); },
  settingsSave() {
    syncSettingsDraft();
    const d = ui.sheet.draft;
    if (d.settings.dayEnd <= d.settings.dayStart) { toast('Wind-down has to come after the start time.'); return; }
    d.routines.forEach((r, i) => { r.order = i; r.name = (r.name || '').trim() || 'Routine'; });
    state.settings = d.settings;
    const ids = new Set(d.routines.map((r) => r.id));
    state.routines = d.routines;
    for (const day of Object.values(state.days)) day.items = day.items.filter((i) => i.type !== 'routine' || ids.has(i.ref));
    closeSheet(); commit(); toast('Settings saved.');
  },
  resetAll() {
    confirmSheet('Erase everything?', `All classes, tasks, routines and days will be deleted${gh.connected ? ', on this device and every device that syncs with it' : ''}. This can’t be undone.`, 'Erase everything', () => {
      const keepMeta = state.meta; state = emptyState(); state.meta = keepMeta; ui.focus = null; $('#focus-root').innerHTML = ''; commit();
    });
  },
  openSync() {
    let back = null;
    if (ui.sheet && ui.sheet.kind === 'settings') { syncSettingsDraft(); back = ui.sheet; }
    openSheet({ kind: 'sync', back, busy: false, err: '' });
  },
  syncBack() { const b = ui.sheet && ui.sheet.back; if (b) openSheet(b); else closeSheet(); },
  async syncConnect() {
    const s = ui.sheet; if (!s || s.busy || !gh.ns) return;
    s.owner = $('#g-owner').value.trim().replace(/^@/, '');
    s.repo = $('#g-repo').value.trim();
    const token = $('#g-token').value.trim();
    if (!s.owner || !s.repo) { s.err = 'Fill in your GitHub username and the repository name.'; renderSheet(); return; }
    if (!token) { s.err = 'Paste your access key. You can make one on GitHub under Settings, Developer settings, Personal access tokens.'; renderSheet(); return; }
    s.busy = true; s.err = ''; s.token = token; renderSheet();
    let r;
    try { r = await gh.ns.connect({ owner: s.owner, repo: s.repo, token }); } catch (e) { r = { error: 'server' }; }
    s.busy = false;
    if (!r || r.error) {
      gh.owner = s.owner; gh.repo = s.repo;
      s.err = syncErrorText(r ? r.error : 'server');
      if (ui.sheet === s) renderSheet();
      return;
    }
    delete s.token;
    gh.connected = true; gh.owner = s.owner; gh.repo = s.repo; gh.base = null; gh.baseState = null; gh.baseCanon = ''; gh.error = '';
    setGh('checking');
    render();
    if (ui.sheet === s) renderSheet();
    toast('Connected. Syncing your plan…');
    runSync(false);
  },
  syncNow() { if (gh.connected) runSync(true); else actions.openSync(); },
  syncDisconnect() {
    confirmSheet(`Turn off syncing on this ${device()}?`, `This ${device()} stops syncing and forgets the access key. Your plan stays here, and your other device keeps its copy.`, 'Turn off syncing', async () => {
      try { await gh.ns.disconnect(); } catch (e) { /* nothing more to clean up */ }
      clearTimeout(gh.timer);
      gh.connected = false; gh.base = null; gh.baseState = null; gh.baseCanon = ''; gh.error = '';
      setGh('off'); render(); toast('Syncing is off on this ' + device() + '.');
    });
  },
  confirmYes() { const fn = ui.sheet.onYes; closeSheet(); if (fn) fn(); },

  // focus
  startFocus(el) { openFocus(ui.sheet && ui.sheet.date ? ui.sheet.date : ui.date, el.dataset.id); },
  focusStart() {
    const f = ui.focus; if (!f || f.running) return;
    f.running = true; f.endsAt = Date.now() + f.remaining; f.lastTick = Date.now();
    if (f.mode === 'focus' && f.date === todayYmd()) {
      const it = findItem(f.date, f.itemId); const info = itemInfo(it);
      const day = getDay(f.date, true);
      if (info && !info.routine && day.firstStart == null) { day.firstStart = nowMin(); commit(); }
    }
    renderFocus();
  },
  focusPause() { const f = ui.focus; if (!f) return; f.running = false; f.remaining = Math.max(0, f.endsAt - Date.now()); renderFocus(); },
  focusReset() { const f = ui.focus; if (!f) return; f.running = false; f.timeUp = false; f.remaining = blockTotal(f); renderFocus(); },
  focusSkip() { if (ui.focus && ui.focus.mode !== 'timer') switchMode(); },
  focusHide() { if (ui.focus) { ui.focus.hidden = true; renderFocus(); render(); } },
  focusShow() { if (ui.focus) { ui.focus.hidden = false; renderFocus(); } },
  focusEnd() { endFocus(); },
  focusStuck() { const f = ui.focus; f.stuckEndsAt = Date.now() + state.settings.stuckMin * 60000; renderFocus(); },
  focusUnstuck() { const f = ui.focus; f.stuckEndsAt = null; f.stuckPrompt = false; renderFocus(); toast('Nice. Keep going.'); },
  focusWriteQ() { const f = ui.focus; f.stuckEndsAt = null; f.stuckPrompt = true; renderFocus(); const q = $('#f-question'); if (q) q.focus(); },
  focusCancelQ() { const f = ui.focus; f.stuckPrompt = false; f.qDraft = ''; renderFocus(); },
  focusSaveQ() {
    const f = ui.focus; const text = ($('#f-question').value || '').trim();
    if (!text) { toast('Write the question first. One sentence is enough.'); return; }
    const info = itemInfo(findItem(f.date, f.itemId));
    const t = questionTarget(info);
    if (t) { t.questions.push({ id: uid('q'), text, at: f.date, asked: false }); commit(); }
    f.stuckPrompt = false; f.qDraft = '';
    renderFocus();
    toast('Saved for your teacher. On to the next problem.');
  },
  focusExtend() {
    const f = ui.focus; const it = findItem(f.date, f.itemId); if (!it) return;
    it.min += 15; shiftAfter(f.date, it, 15);
    f.overrun = false; f.overrunShown = false;
    commit(); renderFocus(); toast('Added 15 minutes. Later items moved back.');
  },
  focusDone() {
    const f = ui.focus; const it = findItem(f.date, f.itemId);
    if (it && itemInfo(it) && !itemInfo(it).done) setItemDone(it, true);
    const date = f.date;
    endFocus(true);
    commit();
    const day = getDay(date);
    const next = it && day.items.filter((i) => i !== it && i.start >= it.start && itemInfo(i) && !itemInfo(i).done).sort((a, b) => a.start - b.start)[0];
    toast(next ? `Done. Next: ${itemInfo(next).title} at ${fmtTime(next.start)}.` : 'Done.');
  },
};
const changes = {
  showDone(el) { ui.showDone = el.checked; render(); },
  planPick(el) { ui.sheet.sel[el.dataset.key] = el.checked; renderSheet(); },
  planLaunch(el) { ui.sheet.launch = el.dataset.key; },
  taskToggle() { syncTaskDraft(); renderSheet(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e);
});
document.addEventListener('input', (e) => {
  if (ui.sheet && ui.sheet.kind === 'task' && e.target.closest('.steprow, #t-due')) {
    syncTaskDraft();
    const box = $('#t-backward');
    if (box) box.outerHTML = backwardBox(ui.sheet.draft);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (ui.sheet) { closeSheet(); return; }
  if (ui.focus && !ui.focus.hidden) actions.focusHide();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (ui.focus) tickFocus(); if (!ui.sheet) render(); } });

// ---------- boot
setInterval(tickFocus, 500);
setInterval(() => { if (ui.tab === 'day' && !ui.sheet && ui.date === todayYmd()) render(); }, 60000);
render();
initDb();
initSync();
document.addEventListener('visibilitychange', () => { if (!document.hidden) wakeSync(); });
window.addEventListener('focus', wakeSync);
window.addEventListener('online', wakeSync);
})();


if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* works without it, just not offline */ }); });
}

</script>
</body>
</html>
